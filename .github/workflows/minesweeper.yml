name: Minesweeper
on:
  issues:
    types: [opened]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  minesweeper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Minesweeper Action
        uses: alexander-schranz/github-action-minesweeper@main
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "minesweeper update"; then
            git push
          fi
